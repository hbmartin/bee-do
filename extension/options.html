<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Annotate → Slack</title>
    <style>
      :root {
        color-scheme: dark;
        --line: #2a2f38;
        --muted: #8a93a0;
        --signal: #ff2e88;
      }
      body {
        margin: 0;
        padding: 40px 28px;
        background: #0b0d10;
        color: #e8eaed;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 460px;
        margin: 0 auto;
      }
      p.eyebrow {
        margin: 0 0 6px;
        color: var(--muted);
        font: 10px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 28px;
        font-size: 20px;
        font-weight: 600;
      }
      label {
        display: block;
        margin-bottom: 18px;
      }
      span {
        display: block;
        margin-bottom: 5px;
      }
      small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
      }
      input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #16191f;
        color: inherit;
        font: 13px/1.4 ui-monospace, Menlo, monospace;
      }
      input:focus {
        border-color: var(--signal);
        outline: none;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        background: var(--signal);
        color: #12040a;
        font: 600 13px/1 inherit;
        cursor: pointer;
      }
      #saved {
        margin-left: 12px;
        color: #6fe0a8;
        font: 11px/1 ui-monospace, Menlo, monospace;
        opacity: 0;
      }
      #saved[data-on] {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Annotate → Slack</p>
      <h1>Where requests go</h1>

      <label>
        <span>Endpoint</span>
        <input id="endpoint" type="url" placeholder="https://your-app.vercel.app/api/ingest" />
        <small>The serverless function that posts to Slack.</small>
      </label>

      <label>
        <span>Shared secret</span>
        <input id="secret" type="password" placeholder="matches ANNOTATE_SECRET" />
      </label>

      <label>
        <span>Your name</span>
        <input id="requester" type="text" placeholder="e.g. Dana" />
        <small>Shown on the request so the thread has a person attached.</small>
      </label>

      <label>
        <span>Project</span>
        <input id="project" type="text" placeholder="svrn" />
        <small>Which repo this page belongs to. Manual for now.</small>
      </label>

      <button id="save">Save settings</button>
      <span id="saved">Saved</span>
    </main>
    <script src="options.js"></script>
  </body>
</html>
