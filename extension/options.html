<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bee-do Capture settings</title>
    <style>
      :root {
        color-scheme: dark;
        --line: #2a2f38;
        --muted: #8a93a0;
        --signal: #ff2e88;
      }
      body {
        margin: 0;
        padding: 40px 28px;
        background: #0b0d10;
        color: #e8eaed;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 500px;
        margin: 0 auto;
      }
      .eyebrow {
        margin: 0 0 6px;
        color: var(--muted);
        font: 10px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 28px;
        font-size: 20px;
        font-weight: 600;
      }
      label {
        display: block;
        margin-bottom: 18px;
      }
      label > span {
        display: block;
        margin-bottom: 5px;
      }
      small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
      }
      code {
        font-family: ui-monospace, Menlo, monospace;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #16191f;
        color: inherit;
        font: 13px/1.4 ui-monospace, Menlo, monospace;
      }
      input:focus {
        border-color: var(--signal);
        outline: none;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        background: var(--signal);
        color: #12040a;
        font: 600 13px/1 inherit;
        cursor: pointer;
      }
      #status {
        display: inline-block;
        margin-left: 12px;
        max-width: 300px;
        color: #6fe0a8;
        font: 11px/1.4 ui-monospace, Menlo, monospace;
      }
      #status[data-tone="bad"] {
        color: #ff8fa8;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Bee-do Capture</p>
      <h1>Pilot settings</h1>

      <form id="settings">
        <label>
          <span>Capture endpoint</span>
          <input id="endpoint" type="url" required placeholder="https://bee-do-ingest.example.workers.dev/v1/captures" />
          <small>The deployed Worker endpoint, including <code>/v1/captures</code>.</small>
        </label>

        <label>
          <span>Pilot secret</span>
          <input id="secret" type="password" required autocomplete="off" placeholder="matches CAPTURE_INGEST_SECRET" />
          <small>Stored only in this browser profile and sent only to the Worker.</small>
        </label>

        <label>
          <span>Your Slack member ID</span>
          <input id="slackUserId" type="text" required spellcheck="false" placeholder="U012ABCDEF" />
          <small>Open your Slack profile → More → Copy member ID.</small>
        </label>

        <button type="submit">Save settings</button>
        <span id="status" role="status" aria-live="polite"></span>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
